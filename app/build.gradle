// SYLLABUS: Gradle Configuration - Module build.gradle
// Demonstrates Android Application plugin, Google Services plugin, SDK level configuration,
// ViewBinding activation, Java 8 compatibility, and third-party dependencies.

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.shoreline.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.shoreline.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // SYLLABUS: Room Schema export location argument (disabled for simple university evaluation)
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    // SYLLABUS: Java language levels (Java 8 Lambdas, Streams, Time API support on minSdk 24)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // SYLLABUS: ViewBinding enabled for type-safe and null-safe view access (no findViewById)
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX & Material UI Components
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // SYLLABUS: Room Database (Local Persistence / Offline-First Cache)
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'

    // SYLLABUS: Firebase Ecosystem (Spark Free Plan Compatible via Firebase BoM)
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database' // For live high-frequency passenger tracking
    implementation 'com.google.firebase:firebase-messaging' // For storm alert broadcasts

    // SYLLABUS: Google Play Services (Nearby Connections & Fused Location)
    implementation 'com.google.android.gms:play-services-nearby:18.7.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // SYLLABUS: Open-Source Mapping (osmdroid - 100% free OSM without paid API keys)
    implementation 'org.osmdroid:osmdroid-android:6.1.16'

    // SYLLABUS: Barcode / QR Scanning (ZXing embedded for vessel registration check)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // SYLLABUS: Background Work (WorkManager for guaranteed background offline queue upload)
    implementation 'androidx.work:work-runtime:2.8.1'

    // Unit Testing & AndroidX Instrumentation
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
